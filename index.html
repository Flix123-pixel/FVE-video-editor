<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CreatorCut Studio Pro Max</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0c0c0e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    header { height: 48px; background: #18181b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #27272a; flex-shrink: 0; }
    .logo { font-size: 1rem; font-weight: 700; color: #ff3366; }
    .btn { background: #ff3366; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background: #27272a; }
    .btn-save { background: #10b981; }

    /* Preview Canvas Area */
    .preview-box { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    canvas { max-width: 95%; max-height: 95%; aspect-ratio: 9/16; background: #18181b; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); }

    /* Control Workspace */
    .controls-panel { background: #18181b; border-top: 1px solid #27272a; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-height: 44vh; overflow-y: auto; flex-shrink: 0; }
    .control-row { display: flex; gap: 8px; align-items: center; overflow-x: auto; white-space: nowrap; }
    .control-row label { font-size: 11px; text-transform: uppercase; color: #a1a1aa; font-weight: 600; }
    input[type="range"] { flex: 1; accent-color: #ff3366; min-width: 80px; }
    input[type="text"], input[type="number"], select { background: #27272a; color: white; border: 1px solid #3f3f46; border-radius: 4px; padding: 4px 8px; font-size: 12px; }

    /* Multi-Track Timeline */
    .timeline { height: 100px; background: #121214; border-top: 1px solid #27272a; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .track { height: 26px; background: #1e1e24; border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; color: #a1a1aa; position: relative; border-left: 4px solid #ff3366; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track.music-track { border-left-color: #eab308; }
    .track.captions-track { border-left-color: #3b82f6; }
    .playhead { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #ff3366; }

    /* Exporting Progress Modal */
    #exportModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #1c1c22; border: 1px solid #2e2e38; border-radius: 12px; padding: 24px; width: 90%; max-width: 380px; text-align: center; }
    .progress-bar-bg { width: 100%; height: 12px; background: #27272a; border-radius: 6px; overflow: hidden; margin: 16px 0 8px 0; }
    .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff3366, #ff758c); transition: width 0.1s linear; }
    .stat-text { font-size: 13px; color: #a1a1aa; margin-top: 4px; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <div class="logo">CreatorCut Studio</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-secondary" onclick="togglePlay()">Play/Pause</button>
      <button class="btn btn-save" onclick="startExport()">Export to Gallery</button>
    </div>
  </header>

  <div class="preview-box">
    <canvas id="viewport" width="720" height="1280"></canvas>
  </div>

  <div class="controls-panel">
    <!-- Media Loaders -->
    <div class="control-row">
      <label>Clip:</label>
      <input type="file" id="videoLoader" accept="video/*" />
      <label>Music:</label>
      <input type="file" id="musicLoader" accept="audio/*" />
      <label>Logo/Watermark:</label>
      <input type="file" id="stickerLoader" accept="image/*" />
    </div>

    <!-- Trimming & Speed Controls -->
    <div class="control-row">
      <label>Cut Start (s):</label>
      <input type="number" id="trimStart" value="0" min="0" step="0.5" style="width: 55px;" onchange="updateTrim()" />
      <label>Cut End (s):</label>
      <input type="number" id="trimEnd" value="0" min="0" step="0.5" style="width: 55px;" onchange="updateTrim()" />
      <label>Speed:</label>
      <select id="speed" onchange="setSpeed(this.value)">
        <option value="1">1x Normal</option>
        <option value="1.5">1.5x Fast</option>
        <option value="2">2x Speedy</option>
        <option value="0.5">0.5x Slow-mo</option>
      </select>
    </div>

    <!-- Aspect Ratio, Rotation & Zoom -->
    <div class="control-row">
      <label>Ratio:</label>
      <select id="aspect" onchange="setAspect(this.value)">
        <option value="9/16">9:16 (Shorts/Reels)</option>
        <option value="16/9">16:9 (Landscape)</option>
        <option value="1/1">1:1 (Square)</option>
      </select>
      <label>Rotate:</label>
      <select id="rotateAngle" onchange="drawFrame()">
        <option value="0">0°</option>
        <option value="90">90°</option>
        <option value="180">180°</option>
        <option value="270">270°</option>
      </select>
      <label>Zoom:</label>
      <input type="range" id="zoom" min="1" max="2" step="0.05" value="1" oninput="drawFrame()" />
    </div>

    <!-- AI Auto Captions & Custom Text -->
    <div class="control-row">
      <label>Subtitles:</label>
      <button class="btn btn-secondary" style="font-size:11px;" onclick="startSpeechRecognition()">🎙️ Auto Captions</button>
      <input type="text" id="captionText" placeholder="Subtitles appear here..." oninput="drawFrame()" />
    </div>

    <!-- HSL & Color Grading Suite -->
    <div class="control-row">
      <label>Hue:</label>
      <input type="range" id="hue" min="0" max="360" value="0" oninput="drawFrame()" />
      <label>Saturation:</label>
      <input type="range" id="sat" min="0" max="250" value="100" oninput="drawFrame()" />
      <label>Vignette:</label>
      <input type="range" id="vignette" min="0" max="100" value="0" oninput="drawFrame()" />
    </div>
  </div>

  <!-- Multi-Track Sequencer -->
  <div class="timeline">
    <div class="track" id="videoTrack">
      <div class="playhead" id="playhead"></div>
      <span id="videoLabel">Video: No file selected</span>
    </div>
    <div class="track music-track">
      <span id="musicLabel">BGM: No track loaded</span>
    </div>
    <div class="track captions-track">
      <span id="captionLabel">Text: No overlay</span>
    </div>
  </div>

  <!-- Realtime Exporting Modal & Time Meter -->
  <div id="exportModal">
    <div class="modal-content">
      <h3>Exporting Video...</h3>
      <p style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">Rendering edits and packaging file...</p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="stat-text" id="progressPercent">0%</div>
      <div class="stat-text" id="progressEta">Estimating time...</div>
    </div>
  </div>

  <!-- Hidden Media Processing Tags -->
  <video id="rawVideo" playsinline crossOrigin="anonymous" style="display:none;"></video>
  <audio id="rawAudio" playsinline crossOrigin="anonymous" style="display:none;"></audio>

  <script>
    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('rawVideo');
    const audio = document.getElementById('rawAudio');
    const playhead = document.getElementById('playhead');
    const captionInput = document.getElementById('captionText');

    let stickerImg = null;
    let exportStartTime = 0;
    let isExporting = false;

    // Load Local Video
    document.getElementById('videoLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        document.getElementById('videoLabel').innerText = `Clip: ${file.name}`;
        video.onloadedmetadata = () => {
          document.getElementById('trimEnd').value = Math.floor(video.duration);
          video.currentTime = 0;
          drawFrame();
        };
      }
    });

    // Load Music
    document.getElementById('musicLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        document.getElementById('musicLabel').innerText = `Music: ${file.name}`;
      }
    });

    // Load Watermark / Sticker
    document.getElementById('stickerLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        stickerImg = new Image();
        stickerImg.src = URL.createObjectURL(file);
        stickerImg.onload = () => drawFrame();
      }
    });

    function togglePlay() {
      if (video.paused) {
        video.play();
        if (audio.src) audio.play();
        renderLoop();
      } else {
        video.pause();
        if (audio.src) audio.pause();
      }
    }

    function setSpeed(rate) {
      video.playbackRate = parseFloat(rate);
      audio.playbackRate = parseFloat(rate);
    }

    function setAspect(ratio) {
      canvas.style.aspectRatio = ratio;
      if (ratio === '9/16') { canvas.width = 720; canvas.height = 1280; }
      else if (ratio === '16/9') { canvas.width = 1280; canvas.height = 720; }
      else { canvas.width = 1080; canvas.height = 1080; }
      drawFrame();
    }

    function updateTrim() {
      const start = parseFloat(document.getElementById('trimStart').value) || 0;
      if (video.currentTime < start) video.currentTime = start;
      drawFrame();
    }

    function renderLoop() {
      if (isExporting) return;

      const end = parseFloat(document.getElementById('trimEnd').value) || video.duration;
      if (video.currentTime >= end) {
        video.pause();
        if (audio.src) audio.pause();
        return;
      }

      if (!video.paused && !video.ended) {
        drawFrame();
        const start = parseFloat(document.getElementById('trimStart').value) || 0;
        const progress = ((video.currentTime - start) / (end - start)) * 100;
        playhead.style.left = `${Math.max(0, Math.min(progress, 100))}%`;
        requestAnimationFrame(renderLoop);
      }
    }

    function drawFrame() {
      const h = document.getElementById('hue').value;
      const s = document.getElementById('sat').value;
      const rot = parseInt(document.getElementById('rotateAngle').value);
      const zoom = parseFloat(document.getElementById('zoom').value);
      const vig = parseInt(document.getElementById('vignette').value);

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rot * Math.PI) / 180);
      ctx.scale(zoom, zoom);

      ctx.filter = `hue-rotate(${h}deg) saturate(${s}%)`;
      ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.filter = 'none';
      ctx.restore();

      // Vignette effect
      if (vig > 0) {
        const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width/4, canvas.width/2, canvas.height/2, canvas.width/1.2);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, `rgba(0,0,0,${vig / 100})`);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Sticker overlay
      if (stickerImg) {
        ctx.drawImage(stickerImg, canvas.width - 160, 40, 120, 120);
      }

      // Subtitles
      const text = captionInput.value;
      if (text) {
        ctx.font = '900 40px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(text, canvas.width / 2, canvas.height - 120);
        ctx.fillStyle = '#ffdf00';
        ctx.fillText(text, canvas.width / 2, canvas.height - 120);
      }
    }

    function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported by your current browser. You can type captions in the box.");
        return;
      }
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = (e) => {
        const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
        captionInput.value = transcript;
        document.getElementById('captionLabel').innerText = `Subtitles: ${transcript}`;
        drawFrame();
      };
      rec.start();
    }

    // High-Compatibility Mobile Video Exporter
    async function startExport() {
      if (!video.src) {
        alert("Please load a video clip first.");
        return;
      }

      isExporting = true;
      const modal = document.getElementById('exportModal');
      const progressFill = document.getElementById('progressFill');
      const progressPercent = document.getElementById('progressPercent');
      const progressEta = document.getElementById('progressEta');

      modal.style.display = 'flex';
      exportStartTime = Date.now();

      const start = parseFloat(document.getElementById('trimStart').value) || 0;
      const end = parseFloat(document.getElementById('trimEnd').value) || video.duration;
      const totalDuration = end - start;

      // Prepare video without triggering browser autoplay lock
      video.pause();
      video.muted = true;
      video.currentTime = start;

      await new Promise(resolve => {
        video.onseeked = resolve;
      });

      const canvasStream = canvas.captureStream(30);

      // Safe audio mixing
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        const dest = audioCtx.createMediaStreamDestination();

        if (audio.src) {
          const musicSource = audioCtx.createMediaElementSource(audio);
          musicSource.connect(dest);
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }

        if (dest.stream.getAudioTracks().length > 0) {
          dest.stream.getAudioTracks().forEach(t => canvasStream.addTrack(t));
        }
      } catch (err) {
        console.warn("Audio bypass active for mobile:", err);
      }

      let mime = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mime)) {
        mime = 'video/mp4';
      }

      let recorder;
      try {
        recorder = new MediaRecorder(canvasStream, { mimeType: mime });
      } catch (e) {
        recorder = new MediaRecorder(canvasStream);
      }

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `CreatorCut_${Date.now()}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        modal.style.display = 'none';
        video.muted = false;
        isExporting = false;
        alert("Export Complete! Saved to your device Downloads.");
      };

      recorder.start(500);

      try {
        await video.play();
      } catch (err) {
        video.muted = true;
        await video.play();
      }

      function processExport() {
        if (video.currentTime >= end || video.ended) {
          video.pause();
          if (audio.src) audio.pause();
          recorder.stop();
          return;
        }

        drawFrame();

        const elapsed = Math.max(0, video.currentTime - start);
        const pct = Math.min(99, Math.max(1, (elapsed / totalDuration) * 100));

        progressFill.style.width = `${pct.toFixed(0)}%`;
        progressPercent.innerText = `${pct.toFixed(0)}%`;

        const realTimeElapsed = (Date.now() - exportStartTime) / 1000;
        const estimatedTotal = (realTimeElapsed / (pct / 100));
        const remaining = Math.max(1, estimatedTotal - realTimeElapsed);
        progressEta.innerText = `ETA: ~${Math.ceil(remaining)}s remaining`;

        requestAnimationFrame(processExport);
      }

      processExport();
    }
  </script>
</body>
</html>
