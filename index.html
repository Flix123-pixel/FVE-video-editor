<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CreatorCut - Advanced Web Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0a0a0c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Bar */
    header { height: 46px; background: #16161a; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #27272a; flex-shrink: 0; }
    .logo { font-size: 1rem; font-weight: 800; color: #ff3366; letter-spacing: 0.5px; }
    .top-actions { display: flex; gap: 8px; }
    .btn { background: #ff3366; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #ff0044; }
    .btn-secondary { background: #27272a; }
    .btn-secondary:hover { background: #3f3f46; }

    /* Preview Workspace */
    .preview-box { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    canvas { max-width: 95%; max-height: 95%; background: #121215; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.85); object-fit: contain; }
    #playPauseBtn { position: absolute; width: 60px; height: 60px; background: rgba(0,0,0,0.65); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 24px; transition: opacity 0.2s; }
    #playPauseBtn.playing { opacity: 0; }
    #playPauseBtn.playing:hover { opacity: 1; }

    /* Control Panel */
    .controls-panel { height: 250px; background: #111114; border-top: 1px solid #27272a; display: flex; flex-direction: column; }
    
    /* Tabs */
    .tab-bar { display: flex; background: #16161a; border-bottom: 1px solid #27272a; }
    .tab { padding: 12px 20px; font-size: 12px; font-weight: 600; color: #71717a; cursor: pointer; }
    .tab.active { color: #ff3366; border-bottom: 2px solid #ff3366; background: #1f1f26; }

    /* Tab Content */
    .tab-content { display: none; padding: 16px; flex-wrap: wrap; gap: 16px; overflow-y: auto; }
    .tab-content.active { display: flex; }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 11px; color: #a1a1aa; font-weight: 600; text-transform: uppercase; }
    select, input[type="number"], input[type="file"], input[type="text"] { background: #27272a; color: white; border: 1px solid #3f3f46; padding: 8px; border-radius: 4px; font-size: 13px; outline: none; }
    
    /* Custom Range Slider */
    input[type="range"] { accent-color: #ff3366; width: 150px; }

    /* Export Overlay */
    #exportOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .progress-bar { width: 300px; height: 10px; background: #27272a; border-radius: 5px; margin-top: 15px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #ff3366; transition: width 0.3s; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">CreatorCut</div>
    <div class="top-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('videoInput').click()">📁 Choose File</button>
      <input type="file" id="videoInput" accept="video/*" style="display: none;" />
      <button class="btn" id="exportBtn">🚀 Export Video</button>
    </div>
  </header>

  <!-- Canvas Preview -->
  <div class="preview-box">
    <canvas id="previewCanvas" width="1080" height="1920"></canvas>
    <div id="playPauseBtn">▶</div>
  </div>

  <!-- Bottom Editor Controls -->
  <div class="controls-panel">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('edit')">✂️ Edit</div>
      <div class="tab" onclick="switchTab('color')">🎨 Color & FX</div>
      <div class="tab" onclick="switchTab('text')">🔤 Text</div>
    </div>

    <!-- Edit Tab -->
    <div id="tab-edit" class="tab-content active">
      <div class="control-group">
        <label>Ratio</label>
        <select id="ratioSelect">
          <option value="9/16">9:16 (Shorts/Reels)</option>
          <option value="16/9">16:9 (Landscape)</option>
          <option value="1/1">1:1 (Square)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Trim Start (sec)</label>
        <input type="number" id="trimStart" value="0" min="0" step="0.1">
      </div>
      <div class="control-group">
        <label>Trim End (sec)</label>
        <input type="number" id="trimEnd" value="0" min="0" step="0.1">
      </div>
      <div class="control-group">
        <label>Speed</label>
        <select id="speedSelect">
          <option value="0.5">0.5x Slow</option>
          <option value="1" selected>1x Normal</option>
          <option value="1.5">1.5x Fast</option>
          <option value="2">2x Speedy</option>
        </select>
      </div>
      <div class="control-group">
        <label>Rotate</label>
        <select id="rotateSelect">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </div>
      <div class="control-group">
        <label>Zoom</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
      </div>
    </div>

    <!-- Color & FX Tab -->
    <div id="tab-color" class="tab-content">
      <div class="control-group">
        <label>Video Filter</label>
        <select id="filterSelect">
          <option value="none">Normal</option>
          <option value="grayscale(100%)">Grayscale (B&W)</option>
          <option value="sepia(100%)">Vintage (Sepia)</option>
          <option value="contrast(150%) saturate(150%)">Pop & Cinematic</option>
          <option value="hue-rotate(90deg)">Alien (Hue Shift)</option>
          <option value="invert(100%)">Invert Colors</option>
        </select>
      </div>
      <div class="control-group">
        <label>Start Transition</label>
        <select id="transitionSelect">
          <option value="none">None</option>
          <option value="fade">Fade In</option>
          <option value="flash">White Flash</option>
        </select>
      </div>
    </div>

    <!-- Text Overlay Tab -->
    <div id="tab-text" class="tab-content">
      <div class="control-group">
        <label>Overlay Text</label>
        <input type="text" id="overlayText" placeholder="Type text here...">
      </div>
      <div class="control-group">
        <label>Text Color</label>
        <input type="color" id="textColor" value="#ffffff" style="height: 35px;">
      </div>
    </div>
  </div>

  <!-- Exporting Overlay -->
  <div id="exportOverlay">
    <h2>Exporting Video...</h2>
    <p style="color: #a1a1aa; margin-top: 5px;">Please wait, rendering frames...</p>
    <div class="progress-bar"><div class="progress-fill" id="exportProgress"></div></div>
  </div>

  <script>
    // --- UI TAB LOGIC ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // --- VIDEO ENGINE SETUP ---
    const video = document.createElement("video");
    video.crossOrigin = "anonymous";
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    let animationId;
    let isExporting = false;

    // Controls
    const playBtn = document.getElementById("playPauseBtn");
    const exportBtn = document.getElementById("exportBtn");
    const trimStartInput = document.getElementById("trimStart");
    const trimEndInput = document.getElementById("trimEnd");

    // --- 1. LOAD FILE ---
    document.getElementById("videoInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      video.src = URL.createObjectURL(file);
      video.load();
      
      video.onloadedmetadata = () => {
        trimEndInput.value = video.duration.toFixed(1);
        updateCanvasRatio();
        drawFrame(); 
      };
    });

    function updateCanvasRatio() {
      const ratio = document.getElementById("ratioSelect").value.split("/");
      const w = parseInt(ratio[0]);
      const h = parseInt(ratio[1]);
      
      // Standardize output resolution based on ratio
      if (w === 9 && h === 16) { canvas.width = 1080; canvas.height = 1920; }
      else if (w === 16 && h === 9) { canvas.width = 1920; canvas.height = 1080; }
      else { canvas.width = 1080; canvas.height = 1080; }
    }

    document.getElementById("ratioSelect").addEventListener("change", () => {
      updateCanvasRatio();
      if(video.paused) drawFrame();
    });

    // --- 2. THE RENDER LOOP (CapCut Style Frame Processing) ---
    function drawFrame() {
      if (!video.src) return;

      // Enforce Trimming
      const startTrim = parseFloat(trimStartInput.value) || 0;
      const endTrim = parseFloat(trimEndInput.value) || video.duration;
      
      if (video.currentTime < startTrim) { video.currentTime = startTrim; }
      if (video.currentTime >= endTrim && !video.paused) {
        video.pause();
        video.currentTime = startTrim;
        playBtn.innerHTML = "▶";
        playBtn.classList.remove("playing");
        if(isExporting) stopExport();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      // Setup Transformations (Zoom & Rotate)
      const zoom = parseFloat(document.getElementById("zoomSlider").value);
      const rotation = parseInt(document.getElementById("rotateSelect").value);
      
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rotation * Math.PI) / 180);
      ctx.scale(zoom, zoom);

      // Setup Filters (Color Tab)
      ctx.filter = document.getElementById("filterSelect").value;

      // Setup Transitions (FX Tab)
      const transition = document.getElementById("transitionSelect").value;
      const timeInClip = video.currentTime - startTrim;
      
      if (transition === "fade" && timeInClip < 1.0) {
         ctx.globalAlpha = timeInClip; // Fade in over 1 second
      } else if (transition === "flash" && timeInClip < 0.5) {
         ctx.filter += ` brightness(${300 - (timeInClip * 400)}%)`; // Flash effect
      } else {
         ctx.globalAlpha = 1.0;
      }

      // Draw Video Center
      // Calculate video aspect ratio preservation
      const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
      const drawW = video.videoWidth * scale;
      const drawH = video.videoHeight * scale;
      ctx.drawImage(video, -drawW / 2, -drawH / 2, drawW, drawH);
      
      ctx.restore(); // Reset transforms for text

      // Add Text Overlay
      const text = document.getElementById("overlayText").value;
      if (text) {
        ctx.font = "bold 80px Arial";
        ctx.fillStyle = document.getElementById("textColor").value;
        ctx.textAlign = "center";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 4;
        ctx.strokeText(text, canvas.width / 2, canvas.height - 150);
        ctx.fillText(text, canvas.width / 2, canvas.height - 150);
      }

      if (!video.paused || isExporting) {
        animationId = requestAnimationFrame(drawFrame);
      }
    }

    // --- 3. PLAYBACK CONTROLS ---
    playBtn.addEventListener("click", () => {
      if (!video.src) return alert("Please select a video file first.");
      if (video.paused) {
        video.playbackRate = parseFloat(document.getElementById("speedSelect").value);
        video.play();
        playBtn.innerHTML = "⏸";
        playBtn.classList.add("playing");
        drawFrame();
      } else {
        video.pause();
        playBtn.innerHTML = "▶";
        playBtn.classList.remove("playing");
      }
    });

    // Update canvas if inputs change while paused
    document.querySelectorAll('select, input').forEach(el => {
      el.addEventListener('input', () => { if(video.paused && video.src) drawFrame(); });
    });

    // --- 4. EXPORT ENGINE (MediaRecorder) ---
    let mediaRecorder;
    let recordedChunks = [];

    exportBtn.addEventListener("click", () => {
      if (!video.src) return alert("Nothing to export! Choose a video first.");
      
      isExporting = true;
      recordedChunks = [];
      document.getElementById('exportOverlay').style.display = 'flex';
      
      // Setup capture stream from canvas
      const stream = canvas.captureStream(30); // 30 FPS
      
      // Try to capture audio from the video as well
      try {
        const audioCtx = new AudioContext();
        const dest = audioCtx.createMediaStreamDestination();
        const sourceNode = audioCtx.createMediaElementSource(video);
        sourceNode.connect(dest);
        sourceNode.connect(audioCtx.destination);
        stream.addTrack(dest.stream.getAudioTracks()[0]);
      } catch(e) { console.log("Audio capture skipped or already connected."); }

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveExport;

      // Start playing to record
      const startTrim = parseFloat(trimStartInput.value) || 0;
      video.currentTime = startTrim;
      video.playbackRate = parseFloat(document.getElementById("speedSelect").value);
      
      mediaRecorder.start();
      video.play();
      drawFrame();

      // Fake progress bar animation (since exact rendering progress is hard to track with live playback)
      let progress = 0;
      const progressInterval = setInterval(() => {
        const duration = (parseFloat(trimEndInput.value) || video.duration) - startTrim;
        progress = ((video.currentTime - startTrim) / duration) * 100;
        document.getElementById('exportProgress').style.width = Math.min(progress, 100) + "%";
        if(progress >= 100) clearInterval(progressInterval);
      }, 200);
    });

    function stopExport() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    function saveExport() {
      isExporting = false;
      document.getElementById('exportOverlay').style.display = 'none';
      document.getElementById('exportProgress').style.width = "0%";
      
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "CreatorCut_Masterpiece.webm";
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
