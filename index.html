<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CREATORcut - Professional Video Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0a0a0c 0%, #1a1a2e 100%); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Bar */
    header { 
      height: 56px; 
      background: linear-gradient(90deg, #16161a 0%, #1f1f26 100%); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 20px; 
      border-bottom: 2px solid #ff3366;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(255, 51, 102, 0.2);
    }
    .logo { 
      font-size: 1.4rem; 
      font-weight: 900; 
      background: linear-gradient(135deg, #ff3366, #ff66ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .btn { 
      background: linear-gradient(135deg, #ff3366, #ff0044); 
      color: white; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 12px; 
      cursor: pointer; 
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
    }
    .btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.5);
    }
    .btn-secondary { 
      background: linear-gradient(135deg, #27272a, #3f3f46); 
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .btn-secondary:hover { 
      background: linear-gradient(135deg, #3f3f46, #52525b);
    }

    /* Preview Workspace */
    .preview-box { 
      flex: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
      overflow: hidden; 
      position: relative;
      border-bottom: 1px solid #27272a;
    }
    canvas { 
      max-width: 95%; 
      max-height: 95%; 
      background: #000; 
      border-radius: 12px; 
      box-shadow: 0 8px 40px rgba(255, 51, 102, 0.3), 0 0 60px rgba(0, 0, 0, 0.9);
      object-fit: contain;
    }
    #playPauseBtn { 
      position: absolute; 
      width: 70px; 
      height: 70px; 
      background: rgba(255, 51, 102, 0.9); 
      border: 3px solid #fff; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255, 51, 102, 0.6);
    }
    #playPauseBtn:hover { 
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(255, 51, 102, 0.8);
    }
    #playPauseBtn.playing { opacity: 0; }
    #playPauseBtn.playing:hover { opacity: 1; }

    /* Control Panel */
    .controls-panel { 
      height: 280px; 
      background: linear-gradient(180deg, #111114 0%, #16161a 100%);
      border-top: 1px solid #27272a; 
      display: flex; 
      flex-direction: column;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.6);
    }
    
    /* Tabs */
    .tab-bar { 
      display: flex; 
      background: #16161a; 
      border-bottom: 1px solid #27272a;
      overflow-x: auto;
    }
    .tab { 
      padding: 12px 18px; 
      font-size: 12px; 
      font-weight: 700; 
      color: #71717a; 
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .tab:hover { color: #ff3366; }
    .tab.active { 
      color: #fff; 
      background: linear-gradient(180deg, #1f1f26 0%, #16161a 100%);
      border-bottom: 3px solid #ff3366;
      box-shadow: inset 0 2px 8px rgba(255, 51, 102, 0.1);
    }

    /* Tab Content */
    .tab-content { 
      display: none; 
      padding: 14px; 
      flex-wrap: wrap; 
      gap: 14px; 
      overflow-y: auto;
      flex: 1;
    }
    .tab-content.active { display: flex; }
    
    .control-group { 
      display: flex; 
      flex-direction: column; 
      gap: 6px;
      flex: 0 1 calc(50% - 7px);
    }
    label { 
      font-size: 10px; 
      color: #a1a1aa; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    select, input[type="number"], input[type="file"], input[type="text"] { 
      background: linear-gradient(135deg, #27272a, #3f3f46); 
      color: white; 
      border: 1px solid #52525b; 
      padding: 8px 10px; 
      border-radius: 6px; 
      font-size: 12px; 
      outline: none;
      transition: all 0.3s ease;
    }
    select:focus, input:focus { 
      border-color: #ff3366;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
      background: linear-gradient(135deg, #3f3f46, #52525b);
    }
    
    /* Custom Range Slider */
    input[type="range"] { 
      accent-color: #ff3366; 
      width: 100%;
      height: 6px;
      cursor: pointer;
    }
    
    input[type="color"] { 
      width: 100%;
      height: 40px;
      cursor: pointer;
      border: 1px solid #52525b;
      border-radius: 6px;
    }

    /* Export Overlay */
    #exportOverlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.95); 
      z-index: 999; 
      display: none; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    #exportOverlay h2 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff3366, #ff66ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .progress-bar { 
      width: 300px; 
      height: 12px; 
      background: #27272a; 
      border-radius: 10px; 
      margin-top: 20px; 
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.2);
    }
    .progress-fill { 
      height: 100%; 
      width: 0%; 
      background: linear-gradient(90deg, #ff3366, #ff66ff);
      transition: width 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.8);
    }

    /* Feature Badges */
    .feature-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff3366, #ff0044);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 8px;
    }

    /* Scrollbar Styling */
    .tab-content::-webkit-scrollbar {
      width: 6px;
    }
    .tab-content::-webkit-scrollbar-track {
      background: #16161a;
    }
    .tab-content::-webkit-scrollbar-thumb {
      background: #ff3366;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">🎬 CREATORcut</div>
    <div class="top-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('videoInput').click()">📁 Choose File</button>
      <input type="file" id="videoInput" accept="video/*,image/*" style="display: none;" />
      <button class="btn" id="exportBtn">🚀 Export Video</button>
    </div>
  </header>

  <!-- Canvas Preview -->
  <div class="preview-box">
    <canvas id="previewCanvas" width="1080" height="1920"></canvas>
    <div id="playPauseBtn">▶</div>
  </div>

  <!-- Bottom Editor Controls -->
  <div class="controls-panel">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('edit')">✂️ Edit</div>
      <div class="tab" onclick="switchTab('effects')">⭐ Effects <span class="feature-badge">FX</span></div>
      <div class="tab" onclick="switchTab('color')">🎨 Color & Filter</div>
      <div class="tab" onclick="switchTab('text')">🔤 Text & Stickers</div>
      <div class="tab" onclick="switchTab('transitions')">🎭 Transitions</div>
      <div class="tab" onclick="switchTab('ai')">🤖 AI Tools <span class="feature-badge">NEW</span></div>
      <div class="tab" onclick="switchTab('advanced')">⚙️ Advanced</div>
    </div>

    <!-- Edit Tab -->
    <div id="tab-edit" class="tab-content active">
      <div class="control-group">
        <label>Aspect Ratio</label>
        <select id="ratioSelect">
          <option value="9/16">9:16 (Shorts/Reels)</option>
          <option value="16/9">16:9 (Landscape)</option>
          <option value="1/1">1:1 (Square)</option>
          <option value="4/3">4:3 (Standard)</option>
          <option value="3/4">3:4 (Portrait)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Trim Start (sec)</label>
        <input type="number" id="trimStart" value="0" min="0" step="0.1">
      </div>
      <div class="control-group">
        <label>Trim End (sec)</label>
        <input type="number" id="trimEnd" value="0" min="0" step="0.1">
      </div>
      <div class="control-group">
        <label>Playback Speed</label>
        <select id="speedSelect">
          <option value="0.25">0.25x Slow Motion</option>
          <option value="0.5">0.5x Slow</option>
          <option value="1" selected>1x Normal</option>
          <option value="1.5">1.5x Fast</option>
          <option value="2">2x Speedy</option>
          <option value="3">3x Ultra Fast</option>
        </select>
      </div>
      <div class="control-group">
        <label>Rotate & Flip</label>
        <select id="rotateSelect">
          <option value="0">0° Normal</option>
          <option value="90">90° Left</option>
          <option value="180">180° Flip</option>
          <option value="270">270° Right</option>
        </select>
      </div>
      <div class="control-group">
        <label>Zoom Level: <span id="zoomValue">1.0x</span></label>
        <input type="range" id="zoomSlider" min="0.3" max="3" step="0.1" value="1">
      </div>
    </div>

    <!-- Effects Tab (CapCut-style effects) -->
    <div id="tab-effects" class="tab-content">
      <div class="control-group">
        <label>Video Effects</label>
        <select id="effectSelect">
          <option value="none">None</option>
          <option value="blur">Blur Effect</option>
          <option value="glow">Glow</option>
          <option value="mosaic">Mosaic/Pixelate</option>
          <option value="vintage">Vintage Film</option>
          <option value="neon">Neon Glow</option>
          <option value="chromatic">Chromatic Aberration</option>
        </select>
      </div>
      <div class="control-group">
        <label>Effect Intensity: <span id="effectIntensity">50</span>%</label>
        <input type="range" id="effectIntensitySlider" min="0" max="100" step="5" value="50">
      </div>
      <div class="control-group">
        <label>Brightness: <span id="brightnessValue">100</span>%</label>
        <input type="range" id="brightnessSlider" min="0" max="200" step="10" value="100">
      </div>
      <div class="control-group">
        <label>Saturation: <span id="saturationValue">100</span>%</label>
        <input type="range" id="saturationSlider" min="0" max="200" step="10" value="100">
      </div>
      <div class="control-group">
        <label>Contrast: <span id="contrastValue">100</span>%</label>
        <input type="range" id="contrastSlider" min="0" max="200" step="10" value="100">
      </div>
      <div class="control-group">
        <label>Hue Shift: <span id="hueValue">0</span>°</label>
        <input type="range" id="hueSlider" min="0" max="360" step="10" value="0">
      </div>
    </div>

    <!-- Color & Filter Tab (Inshot/KineMaster style) -->
    <div id="tab-color" class="tab-content">
      <div class="control-group">
        <label>Preset Filters</label>
        <select id="filterSelect">
          <option value="none">Normal</option>
          <option value="grayscale">B&W (Grayscale)</option>
          <option value="sepia">Vintage (Sepia)</option>
          <option value="cinematic">Cinematic</option>
          <option value="cool">Cool Blue</option>
          <option value="warm">Warm Gold</option>
          <option value="retro">Retro 70s</option>
          <option value="vivid">Vivid Colors</option>
        </select>
      </div>
      <div class="control-group">
        <label>Background Color</label>
        <input type="color" id="bgColor" value="#000000" style="height: 35px;">
      </div>
      <div class="control-group">
        <label>Color LUT</label>
        <select id="lutSelect">
          <option value="default">Default</option>
          <option value="lut1">Film Stock</option>
          <option value="lut2">HDR</option>
          <option value="lut3">Dark Cinema</option>
        </select>
      </div>
      <div class="control-group">
        <label>Opacity: <span id="opacityValue">100</span>%</label>
        <input type="range" id="opacitySlider" min="0" max="100" step="5" value="100">
      </div>
    </div>

    <!-- Text & Stickers Tab (CapCut/Inshot style) -->
    <div id="tab-text" class="tab-content">
      <div class="control-group">
        <label>Text Overlay</label>
        <input type="text" id="overlayText" placeholder="Type text here...">
      </div>
      <div class="control-group">
        <label>Text Color</label>
        <input type="color" id="textColor" value="#ffffff" style="height: 35px;">
      </div>
      <div class="control-group">
        <label>Font Size: <span id="fontSizeValue">80</span>px</label>
        <input type="range" id="fontSizeSlider" min="20" max="200" step="5" value="80">
      </div>
      <div class="control-group">
        <label>Text Position</label>
        <select id="textPositionSelect">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
          <option value="center">Center</option>
          <option value="custom">Custom (Y Position)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Sticker Pack</label>
        <select id="stickerSelect">
          <option value="none">None</option>
          <option value="emoji">Emoji Pack</option>
          <option value="particles">Particle Effects</option>
          <option value="badges">Badges</option>
          <option value="shapes">Shapes</option>
        </select>
      </div>
      <div class="control-group">
        <label>Shadow Effect</label>
        <input type="checkbox" id="textShadow"> Apply Shadow
      </div>
    </div>

    <!-- Transitions Tab (Kwai Cut/CapCut style) -->
    <div id="tab-transitions" class="tab-content">
      <div class="control-group">
        <label>Start Transition</label>
        <select id="transitionSelect">
          <option value="none">None</option>
          <option value="fade">Fade In</option>
          <option value="slideLeft">Slide Left</option>
          <option value="slideRight">Slide Right</option>
          <option value="slideUp">Slide Up</option>
          <option value="slideDown">Slide Down</option>
          <option value="zoomIn">Zoom In</option>
          <option value="flash">White Flash</option>
          <option value="blur">Blur Transition</option>
        </select>
      </div>
      <div class="control-group">
        <label>End Transition</label>
        <select id="endTransitionSelect">
          <option value="none">None</option>
          <option value="fade">Fade Out</option>
          <option value="slideLeft">Slide Left</option>
          <option value="slideRight">Slide Right</option>
          <option value="zoomOut">Zoom Out</option>
          <option value="flash">White Flash</option>
        </select>
      </div>
      <div class="control-group">
        <label>Transition Duration: <span id="transitionDurationValue">0.5</span>s</label>
        <input type="range" id="transitionDurationSlider" min="0.1" max="2" step="0.1" value="0.5">
      </div>
    </div>

    <!-- AI Tools Tab (NEW FEATURE) -->
    <div id="tab-ai" class="tab-content">
      <div class="control-group">
        <label>AI Video Generation</label>
        <select id="aiVideoSelect">
          <option value="none">Disabled</option>
          <option value="enhance">Enhance Quality (Upscale)</option>
          <option value="denoise">Remove Noise</option>
          <option value="frameinterpolate">Frame Interpolation</option>
          <option value="colorgrade">Auto Color Grade</option>
        </select>
      </div>
      <div class="control-group">
        <label>AI Photo Generation</label>
        <select id="aiPhotoSelect">
          <option value="none">None</option>
          <option value="generate">Generate from Prompt</option>
          <option value="background">AI Background</option>
          <option value="cartoon">Cartoon Effect</option>
          <option value="anime">Anime Style</option>
          <option value="oil">Oil Painting</option>
        </select>
      </div>
      <div class="control-group">
        <label>AI Prompt (for generation)</label>
        <input type="text" id="aiPrompt" placeholder="Describe what you want...">
      </div>
      <div class="control-group">
        <label>AI Processing Power: <span id="aiPowerValue">Medium</span></label>
        <select id="aiPowerSelect">
          <option value="low">Low (Fast)</option>
          <option value="medium" selected>Medium (Balanced)</option>
          <option value="high">High (Best Quality)</option>
        </select>
      </div>
      <div class="control-group">
        <button class="btn" style="width: 100%; margin-top: 8px;">🔄 Process with AI</button>
      </div>
    </div>

    <!-- Advanced Tab (KineMaster/CapCut advanced features) -->
    <div id="tab-advanced" class="tab-content">
      <div class="control-group">
        <label>Aspect Ratio Fit</label>
        <select id="fitSelect">
          <option value="cover">Cover (Crop)</option>
          <option value="contain">Contain (Letterbox)</option>
          <option value="fill">Fill</option>
        </select>
      </div>
      <div class="control-group">
        <label>Key Frame Animation</label>
        <input type="checkbox" id="keyframeEnable"> Enable Keyframes
      </div>
      <div class="control-group">
        <label>Motion Blur: <span id="motionBlurValue">0</span>%</label>
        <input type="range" id="motionBlurSlider" min="0" max="100" step="10" value="0">
      </div>
      <div class="control-group">
        <label>3D Depth Effect: <span id="depthValue">0</span>%</label>
        <input type="range" id="depthSlider" min="0" max="100" step="10" value="0">
      </div>
      <div class="control-group">
        <label>Resolution Output</label>
        <select id="resolutionSelect">
          <option value="720">720p (Standard)</option>
          <option value="1080" selected>1080p (HD)</option>
          <option value="2k">2K (2560x1440)</option>
          <option value="4k">4K (UHD)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Bitrate: <span id="bitrateValue">6000</span> kbps</label>
        <input type="range" id="bitrateSlider" min="1000" max="50000" step="1000" value="6000">
      </div>
    </div>
  </div>

  <!-- Exporting Overlay -->
  <div id="exportOverlay">
    <h2>🎬 CREATORcut Rendering...</h2>
    <p style="color: #a1a1aa; margin-top: 5px;">Processing your masterpiece...</p>
    <div class="progress-bar"><div class="progress-fill" id="exportProgress"></div></div>
  </div>

  <script>
    // --- UI TAB LOGIC ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // --- SLIDER VALUE UPDATES ---
    document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.getElementById('zoomValue').textContent = (e.target.value + 'x').substring(0, 4);
    });
    document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
      document.getElementById('fontSizeValue').textContent = e.target.value;
    });
    document.getElementById('effectIntensitySlider').addEventListener('input', (e) => {
      document.getElementById('effectIntensity').textContent = e.target.value;
    });
    document.getElementById('brightnessSlider').addEventListener('input', (e) => {
      document.getElementById('brightnessValue').textContent = e.target.value;
    });
    document.getElementById('saturationSlider').addEventListener('input', (e) => {
      document.getElementById('saturationValue').textContent = e.target.value;
    });
    document.getElementById('contrastSlider').addEventListener('input', (e) => {
      document.getElementById('contrastValue').textContent = e.target.value;
    });
    document.getElementById('hueSlider').addEventListener('input', (e) => {
      document.getElementById('hueValue').textContent = e.target.value;
    });
    document.getElementById('opacitySlider').addEventListener('input', (e) => {
      document.getElementById('opacityValue').textContent = e.target.value;
    });
    document.getElementById('transitionDurationSlider').addEventListener('input', (e) => {
      document.getElementById('transitionDurationValue').textContent = e.target.value;
    });
    document.getElementById('motionBlurSlider').addEventListener('input', (e) => {
      document.getElementById('motionBlurValue').textContent = e.target.value;
    });
    document.getElementById('depthSlider').addEventListener('input', (e) => {
      document.getElementById('depthValue').textContent = e.target.value;
    });
    document.getElementById('bitrateSlider').addEventListener('input', (e) => {
      document.getElementById('bitrateValue').textContent = e.target.value;
    });

    // --- VIDEO ENGINE SETUP ---
    const video = document.createElement("video");
    video.crossOrigin = "anonymous";
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");
    let animationId;
    let isExporting = false;

    // Controls
    const playBtn = document.getElementById("playPauseBtn");
    const exportBtn = document.getElementById("exportBtn");
    const trimStartInput = document.getElementById("trimStart");
    const trimEndInput = document.getElementById("trimEnd");

    // --- 1. LOAD FILE ---
    document.getElementById("videoInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      video.src = URL.createObjectURL(file);
      video.load();
      
      video.onloadedmetadata = () => {
        trimEndInput.value = video.duration.toFixed(1);
        updateCanvasRatio();
        drawFrame(); 
      };
    });

    function updateCanvasRatio() {
      const ratio = document.getElementById("ratioSelect").value.split("/");
      const w = parseInt(ratio[0]);
      const h = parseInt(ratio[1]);
      
      // Standardize output resolution based on ratio
      if (w === 9 && h === 16) { canvas.width = 1080; canvas.height = 1920; }
      else if (w === 16 && h === 9) { canvas.width = 1920; canvas.height = 1080; }
      else if (w === 1 && h === 1) { canvas.width = 1080; canvas.height = 1080; }
      else if (w === 4 && h === 3) { canvas.width = 1080; canvas.height = 810; }
      else { canvas.width = 810; canvas.height = 1080; }
    }

    document.getElementById("ratioSelect").addEventListener("change", () => {
      updateCanvasRatio();
      if(video.paused) drawFrame();
    });

    // --- 2. THE RENDER LOOP (Professional Frame Processing) ---
    function drawFrame() {
      if (!video.src) return;

      const startTrim = parseFloat(trimStartInput.value) || 0;
      const endTrim = parseFloat(trimEndInput.value) || video.duration;
      
      if (video.currentTime < startTrim) { video.currentTime = startTrim; }
      if (video.currentTime >= endTrim && !video.paused) {
        video.pause();
        video.currentTime = startTrim;
        playBtn.innerHTML = "▶";
        playBtn.classList.remove("playing");
        if(isExporting) stopExport();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Background with color option
      const bgColor = document.getElementById("bgColor").value;
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.save();

      // Setup Transformations
      const zoom = parseFloat(document.getElementById("zoomSlider").value);
      const rotation = parseInt(document.getElementById("rotateSelect").value);
      const fit = document.getElementById("fitSelect").value;
      
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rotation * Math.PI) / 180);
      ctx.scale(zoom, zoom);

      // Apply Advanced Filters
      let filterString = '';
      const brightness = document.getElementById("brightnessSlider").value;
      const saturation = document.getElementById("saturationSlider").value;
      const contrast = document.getElementById("contrastSlider").value;
      const hueShift = document.getElementById("hueSlider").value;
      const opacity = document.getElementById("opacitySlider").value / 100;

      filterString = `brightness(${brightness}%) saturate(${saturation}%) contrast(${contrast}%) hue-rotate(${hueShift}deg)`;

      // Apply preset filters
      const filterSelect = document.getElementById("filterSelect").value;
      if (filterSelect === "grayscale") filterString += " grayscale(100%)";
      else if (filterSelect === "sepia") filterString += " sepia(100%)";
      else if (filterSelect === "cinematic") filterString += " contrast(120%) saturate(110%)";
      else if (filterSelect === "cool") filterString += " hue-rotate(180deg) saturate(120%)";
      else if (filterSelect === "warm") filterString += " hue-rotate(-15deg) saturate(120%)";
      else if (filterSelect === "retro") filterString += " sepia(80%) hue-rotate(-20deg)";
      else if (filterSelect === "vivid") filterString += " saturate(150%) contrast(130%)";

      ctx.filter = filterString;
      ctx.globalAlpha = opacity;

      // Handle Transitions
      const transition = document.getElementById("transitionSelect").value;
      const transitionDuration = parseFloat(document.getElementById("transitionDurationSlider").value);
      const timeInClip = video.currentTime - startTrim;
      
      if (transition === "fade" && timeInClip < transitionDuration) {
         ctx.globalAlpha = (timeInClip / transitionDuration) * opacity;
      } else if (transition === "flash" && timeInClip < transitionDuration) {
         ctx.filter += ` brightness(${300 - (timeInClip / transitionDuration * 200)}%)`;
      } else if (transition === "zoomIn" && timeInClip < transitionDuration) {
         const zoomFactor = 1 + ((1 - timeInClip / transitionDuration) * 0.3);
         ctx.scale(1 / zoomFactor, 1 / zoomFactor);
      }

      // Draw Video
      const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
      const drawW = video.videoWidth * scale;
      const drawH = video.videoHeight * scale;
      ctx.drawImage(video, -drawW / 2, -drawH / 2, drawW, drawH);
      
      ctx.restore();

      // Add Text Overlay with advanced options
      const text = document.getElementById("overlayText").value;
      if (text) {
        const fontSize = document.getElementById("fontSizeSlider").value;
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillStyle = document.getElementById("textColor").value;
        ctx.textAlign = "center";
        
        let textY = canvas.height - 150;
        const textPosition = document.getElementById("textPositionSelect").value;
        if (textPosition === "top") textY = 100;
        else if (textPosition === "center") textY = canvas.height / 2;

        if (document.getElementById("textShadow").checked) {
          ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
          ctx.shadowBlur = 10;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;
        }

        ctx.strokeStyle = "black";
        ctx.lineWidth = 4;
        ctx.strokeText(text, canvas.width / 2, textY);
        ctx.fillText(text, canvas.width / 2, textY);
      }

      if (!video.paused || isExporting) {
        animationId = requestAnimationFrame(drawFrame);
      }
    }

    // --- 3. PLAYBACK CONTROLS ---
    playBtn.addEventListener("click", () => {
      if (!video.src) return alert("Please select a video file first.");
      if (video.paused) {
        video.playbackRate = parseFloat(document.getElementById("speedSelect").value);
        video.play();
        playBtn.innerHTML = "⏸";
        playBtn.classList.add("playing");
        drawFrame();
      } else {
        video.pause();
        playBtn.innerHTML = "▶";
        playBtn.classList.remove("playing");
      }
    });

    document.querySelectorAll('select, input').forEach(el => {
      el.addEventListener('input', () => { if(video.paused && video.src) drawFrame(); });
    });

    // --- 4. EXPORT ENGINE ---
    let mediaRecorder;
    let recordedChunks = [];

    exportBtn.addEventListener("click", () => {
      if (!video.src) return alert("Nothing to export! Choose a video first.");
      
      isExporting = true;
      recordedChunks = [];
      document.getElementById('exportOverlay').style.display = 'flex';
      
      const stream = canvas.captureStream(30);
      
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const dest = audioCtx.createMediaStreamDestination();
        const sourceNode = audioCtx.createMediaElementSource(video);
        sourceNode.connect(dest);
        sourceNode.connect(audioCtx.destination);
        stream.addTrack(dest.stream.getAudioTracks()[0]);
      } catch(e) { console.log("Audio capture skipped."); }

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveExport;

      const startTrim = parseFloat(trimStartInput.value) || 0;
      video.currentTime = startTrim;
      video.playbackRate = parseFloat(document.getElementById("speedSelect").value);
      
      mediaRecorder.start();
      video.play();
      drawFrame();

      let progress = 0;
      const progressInterval = setInterval(() => {
        const duration = (parseFloat(trimEndInput.value) || video.duration) - startTrim;
        progress = ((video.currentTime - startTrim) / duration) * 100;
        document.getElementById('exportProgress').style.width = Math.min(progress, 100) + "%";
        if(progress >= 100) clearInterval(progressInterval);
      }, 200);
    });

    function stopExport() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    function saveExport() {
      isExporting = false;
      document.getElementById('exportOverlay').style.display = 'none';
      document.getElementById('exportProgress').style.width = "0%";
      
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `CREATORcut_${new Date().getTime()}.webm`;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
