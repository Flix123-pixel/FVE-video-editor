<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FVE Video Editor</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#08090d;color:#fff;font-family:Arial,sans-serif
}
button,input{font:inherit}
button{border:0;color:white}
.app{height:100%;display:flex;flex-direction:column}

/* HEADER */
.header{
  height:58px;min-height:58px;background:#11131a;
  border-bottom:1px solid #292c35;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px
}
.logo{font-size:20px;font-weight:900}
.logo span{color:#00d9ff}
.headerBtns{display:flex;gap:6px}
.hbtn{
  height:38px;min-width:38px;padding:0 10px;
  border-radius:9px;background:#20232c
}
.export{
  background:#00d9ff;color:#001014;font-weight:800
}

/* PREVIEW */
.preview{
  flex:1;min-height:0;background:#050506;
  display:flex;align-items:center;justify-content:center;
  position:relative;padding:10px
}
.stage{
  position:relative;
  width:min(94vw,720px);
  height:min(58vh,500px);
  background:#000;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-radius:8px
}
video{
  width:100%;height:100%;object-fit:contain;
  display:none;background:#000
}
.empty{
  display:flex;flex-direction:column;align-items:center;
  gap:12px;color:#888;text-align:center
}
.emptyIcon{font-size:48px}
.importMain{
  background:#00d9ff;color:#001014;
  padding:12px 20px;border-radius:10px;font-weight:bold
}
#overlay{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;padding:20px;text-align:center;
  font-weight:900;font-size:30px;text-shadow:2px 2px 5px #000;
  white-space:pre-wrap;word-break:break-word
}

/* PLAYER */
.player{
  height:50px;min-height:50px;background:#11131a;
  display:flex;align-items:center;gap:8px;padding:5px 9px
}
.play{
  width:38px;height:38px;border-radius:50%;
  background:#00d9ff;color:#001014;font-weight:bold
}
.seek{flex:1;accent-color:#00d9ff}
.clock{font-size:11px;color:#aaa;min-width:78px;text-align:right}

/* TIMELINE */
.timeline{
  height:130px;min-height:130px;
  background:#0d0f14;border-top:1px solid #282b34;
  padding:8px
}
.timelineTop{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:7px
}
.timelineTitle{font-weight:bold;font-size:13px}
.timelineBtns{display:flex;gap:5px}
.small{
  background:#20232c;border-radius:7px;
  padding:6px 9px;font-size:11px
}
.track{
  height:57px;border-radius:8px;background:#050609;
  border:1px solid #292c35;position:relative;overflow:hidden
}
.clip{
  position:absolute;left:0;top:6px;bottom:6px;
  width:100%;border-radius:6px;
  background:linear-gradient(90deg,#12343c,#1d515d,#12343c);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#b9f5ff
}
.head{
  position:absolute;top:0;bottom:0;width:2px;
  background:#00eaff;left:0;z-index:5
}

/* TOOLS */
.tools{
  height:108px;min-height:108px;background:#11131a;
  border-top:1px solid #292c35;display:flex;
  gap:7px;padding:8px;overflow-x:auto
}
.tools::-webkit-scrollbar{display:none}
.tool{
  min-width:67px;height:82px;background:#1b1e27;
  border-radius:10px;display:flex;
  flex-direction:column;align-items:center;
  justify-content:center;gap:7px;font-size:10px
}
.tool b{font-size:22px}
.tool:active{transform:scale(.95)}
.tool.active{background:#12323a;color:#00e5ff}

/* PANEL */
.panel{
  position:fixed;z-index:20;left:0;right:0;bottom:108px;
  max-height:55%;background:#171920;
  border-top:1px solid #343741;border-radius:16px 16px 0 0;
  padding:14px;transform:translateY(110%);
  transition:.2s;overflow:auto
}
.panel.open{transform:translateY(0)}
.panelHead{
  display:flex;align-items:center;
  justify-content:space-between;margin-bottom:12px
}
.panelHead h3{margin:0;font-size:16px}
.close{
  width:32px;height:32px;border-radius:8px;
  background:#282b34
}
.row{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px
}
.option{
  min-width:70px;padding:11px 8px;
  border-radius:9px;background:#252832;text-align:center;
  font-size:11px
}
.option.active{outline:2px solid #00d9ff}
.control{margin:12px 0}
.control label{
  display:flex;justify-content:space-between;
  font-size:12px;color:#ccc;margin-bottom:6px
}
input[type=range]{width:100%;accent-color:#00d9ff}
.textInput{
  width:100%;padding:12px;border-radius:9px;
  border:1px solid #333743;background:#0b0d12;
  color:#fff;outline:none
}
.action{
  width:100%;padding:12px;margin-top:7px;
  border-radius:9px;background:#00d9ff;
  color:#001014;font-weight:bold
}

/* MODAL */
.modal{
  display:none;position:fixed;inset:0;z-index:100;
  background:#000b;align-items:flex-end
}
.modal.show{display:flex}
.modalBox{
  width:100%;background:#171920;padding:18px;
  border-radius:18px 18px 0 0
}
.progress{
  height:8px;background:#30333b;border-radius:10px;
  overflow:hidden;margin:15px 0
}
.progress div{height:100%;width:0;background:#00d9ff}
.status{font-size:12px;color:#aaa}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">FVE <span>Video Editor</span></div>

  <div class="headerBtns">
    <button class="hbtn" id="undo">↶</button>
    <button class="hbtn" id="redo">↷</button>
    <button class="hbtn" id="newProject">＋</button>
    <button class="hbtn export" id="export">Export</button>
  </div>
</header>

<main class="preview">

  <div class="stage" id="stage">

    <video id="video" playsinline></video>

    <div class="empty" id="empty">
      <div class="emptyIcon">🎬</div>
      <div>Import a video to start editing</div>
      <button class="importMain" id="importButton">
        📂 Import Video
      </button>
    </div>

    <div id="overlay"></div>

  </div>

</main>

<div class="player">
  <button class="play" id="play">▶</button>

  <input
    class="seek"
    id="seek"
    type="range"
    min="0"
    max="100"
    value="0"
  >

  <div class="clock" id="clock">00:00 / 00:00</div>
</div>

<section class="timeline">

  <div class="timelineTop">
    <div class="timelineTitle">TIMELINE</div>

    <div class="timelineBtns">
      <button class="small" id="fullscreen">⛶</button>
      <button class="small" id="fit">Fit</button>
    </div>
  </div>

  <div class="track">
    <div class="clip" id="clip">Import video</div>
    <div class="head" id="head"></div>
  </div>

</section>

<nav class="tools">

  <button class="tool" data-tool="media">
    <b>＋</b>Media
  </button>

  <button class="tool" data-tool="trim">
    <b>✂</b>Trim
  </button>

  <button class="tool" data-tool="audio">
    <b>🔊</b>Audio
  </button>

  <button class="tool" data-tool="text">
    <b>T</b>Text
  </button>

  <button class="tool" data-tool="filter">
    <b>◐</b>Filters
  </button>

  <button class="tool" data-tool="adjust">
    <b>☼</b>Adjust
  </button>

  <button class="tool" data-tool="speed">
    <b>⚡</b>Speed
  </button>

  <button class="tool" data-tool="ratio">
    <b>▣</b>Ratio
  </button>

  <button class="tool" data-tool="rotate">
    <b>⟳</b>Rotate
  </button>

  <button class="tool" data-tool="sticker">
    <b>😊</b>Sticker
  </button>

  <button class="tool" data-tool="caption">
    <b>CC</b>Caption
  </button>

</nav>

</div>

<div class="panel" id="panel">

  <div class="panelHead">
    <h3 id="panelTitle">Tool</h3>
    <button class="close" id="closePanel">×</button>
  </div>

  <div id="panelContent"></div>

</div>

<input
  type="file"
  id="file"
  accept="video/*"
  hidden
>

<div class="modal" id="exportModal">

  <div class="
