<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creatorCUT - Working Web Editor</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --accent: #8a2be2;
            --accent-hover: #9b4dff;
            --text: #ffffff;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-main); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { background: var(--bg-panel); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: bold; background: linear-gradient(90deg, #ff007a, #8a2be2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { background: #555; cursor: not-allowed; }
        
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .control-group input[type="range"] { width: 100%; margin-bottom: 5px; }
        .control-group input[type="text"], .control-group input[type="number"], .control-group input[type="color"] { width: 100%; padding: 8px; background: var(--bg-main); border: 1px solid var(--border); color: white; border-radius: 4px; margin-bottom: 5px; }
        
        .main-stage { flex: 1; display: flex; flex-direction: column; }
        .preview-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: #000; }
        canvas { max-width: 100%; max-height: 100%; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .timeline { height: 80px; background: var(--bg-panel); border-top: 1px solid var(--border); padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
        #scrubber { flex: 1; cursor: pointer; }
        
        /* Hidden actual video element used for source frames */
        #sourceVideo { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">creatorCUT v1.0</div>
        <div>
            <label class="btn" style="cursor: pointer; margin-right: 10px;">
                Upload Video
                <input type="file" id="videoInput" accept="video/*" style="display: none;">
            </label>
            <button class="btn" id="exportBtn">Export WebM</button>
        </div>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <div class="control-group">
                <label>Trim Video (Seconds)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="trimStart" placeholder="Start" value="0" min="0" step="0.1">
                    <input type="number" id="trimEnd" placeholder="End" min="0" step="0.1">
                </div>
            </div>

            <hr style="border-color: var(--border); margin: 20px 0;">

            <div class="control-group">
                <label>Filters (Live Preview)</label>
                <label style="font-size: 11px;">Brightness</label>
                <input type="range" id="brightness" min="0" max="200" value="100">
                <label style="font-size: 11px;">Contrast</label>
                <input type="range" id="contrast" min="0" max="200" value="100">
                <label style="font-size: 11px;">Sepia</label>
                <input type="range" id="sepia" min="0" max="100" value="0">
            </div>

            <hr style="border-color: var(--border); margin: 20px 0;">

            <div class="control-group">
                <label>Text Overlay</label>
                <input type="text" id="overlayText" placeholder="Enter text here...">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="fontSize" value="60" placeholder="Size">
                    <input type="color" id="textColor" value="#ffffff">
                </div>
            </div>
        </div>

        <div class="main-stage">
            <div class="preview-container">
                <canvas id="videoCanvas" width="1280" height="720"></canvas>
            </div>
            <div class="timeline">
                <button class="btn" id="playBtn" style="width: 80px;">Play</button>
                <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
                <span id="timeDisplay" style="font-family: monospace; font-size: 12px;">00:00.0</span>
            </div>
        </div>
    </div>

    <video id="sourceVideo" crossorigin="anonymous" playsinline></video>

    <script>
        const videoInput = document.getElementById('videoInput');
        const sourceVideo = document.getElementById('sourceVideo');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        const scrubber = document.getElementById('scrubber');
        const timeDisplay = document.getElementById('timeDisplay');
        const exportBtn = document.getElementById('exportBtn');
        
        let isExporting = false;
        let animationId;

        // 1. Handle File Upload
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            sourceVideo.src = url;
            sourceVideo.load();
        });

        // 2. Setup Canvas when Video Loads
        sourceVideo.addEventListener('loadedmetadata', () => {
            canvas.width = sourceVideo.videoWidth;
            canvas.height = sourceVideo.videoHeight;
            scrubber.max = sourceVideo.duration;
            document.getElementById('trimEnd').value = sourceVideo.duration.toFixed(1);
            renderFrame(); // Draw the first frame
        });

        // 3. The Core Rendering Engine
        function renderFrame() {
            // Clear previous frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Apply Video Filters
            const brightness = document.getElementById('brightness').value;
            const contrast = document.getElementById('contrast').value;
            const sepia = document.getElementById('sepia').value;
            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) sepia(${sepia}%)`;
            
            // Draw Video Frame to Canvas
            ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
            
            // Apply Text Overlay (Filter must be reset first)
            ctx.filter = 'none';
            const text = document.getElementById('overlayText').value;
            if(text) {
                const fontSize = document.getElementById('fontSize').value;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = document.getElementById('textColor').value;
                ctx.textAlign = 'center';
                // Draw text with a slight shadow for visibility
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 10;
                ctx.fillText(text, canvas.width / 2, canvas.height - 80);
                ctx.shadowBlur = 0; // reset
            }

            // Update UI if not exporting
            if(!isExporting) {
                scrubber.value = sourceVideo.currentTime;
                timeDisplay.innerText = formatTime(sourceVideo.currentTime);
            }
        }

        // The Playback Loop
        function loop() {
            if(!sourceVideo.paused && !sourceVideo.ended) {
                renderFrame();
                animationId = requestAnimationFrame(loop);
            }
        }

        // 4. Playback Controls
        playBtn.addEventListener('click', () => {
            if(!sourceVideo.src) return alert('Please upload a video first.');
            if(sourceVideo.paused) {
                sourceVideo.play();
                playBtn.innerText = "Pause";
                loop();
            } else {
                sourceVideo.pause();
                playBtn.innerText = "Play";
                cancelAnimationFrame(animationId);
            }
        });

        // Scrubbing the timeline
        scrubber.addEventListener('input', (e) => {
            sourceVideo.currentTime = e.target.value;
            setTimeout(renderFrame, 30); // Allow video to seek then draw
        });

        // Re-render when filters/text change while paused
        ['brightness', 'contrast', 'sepia', 'overlayText', 'fontSize', 'textColor'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if(sourceVideo.paused) renderFrame();
            });
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toFixed(1).padStart(4, '0');
            return `${m}:${s}`;
        }

        // 5. The Real Export Engine (MediaRecorder)
        exportBtn.addEventListener('click', () => {
            if(!sourceVideo.src) return alert("Upload a video first!");
            
            const trimStart = parseFloat(document.getElementById('trimStart').value) || 0;
            const trimEnd = parseFloat(document.getElementById('trimEnd').value) || sourceVideo.duration;

            isExporting = true;
            exportBtn.innerText = "Exporting...";
            exportBtn.disabled = true;
            playBtn.disabled = true;
            
            const recordedChunks = [];
            
            // Capture the canvas visual stream at 30 FPS
            const canvasStream = canvas.captureStream(30);
            
            // Try to capture original audio track
            try {
                const videoStream = sourceVideo.captureStream ? sourceVideo.captureStream() : (sourceVideo.mozCaptureStream ? sourceVideo.mozCaptureStream() : null);
                if(videoStream && videoStream.getAudioTracks().length > 0) {
                    canvasStream.addTrack(videoStream.getAudioTracks()[0]);
                }
            } catch(e) { console.warn("Audio capture failed", e); }

            // Initialize Recorder
            const mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = (e) => {
                if(e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                isExporting = false;
                
                // Create downloadable file
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'creatorCUT_Export.webm';
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(url);
                
                // Reset UI
                exportBtn.innerText = "Export WebM";
                exportBtn.disabled = false;
                playBtn.disabled = false;
                sourceVideo.pause();
                playBtn.innerText = "Play";
            };

            // Start playing from Trim Start
            sourceVideo.currentTime = trimStart;
            sourceVideo.play();
            mediaRecorder.start();
            loop(); // Kick off render engine

            // Check every 100ms if we hit the Trim End time
            const checkEnd = setInterval(() => {
                if(sourceVideo.currentTime >= trimEnd || sourceVideo.ended) {
                    mediaRecorder.stop();
                    clearInterval(checkEnd);
                }
            }, 100);
        });
    </script>
</body>
</html>
